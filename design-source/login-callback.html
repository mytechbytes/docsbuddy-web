<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Opening DocsBuddy…</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0D1A2B" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#F4F6FA;color:#0D1A2B;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .card{
    width:100%;max-width:420px;background:#fff;border:1px solid #E7EBF2;border-radius:24px;
    padding:40px 32px;text-align:center;box-shadow:0 12px 40px rgba(13,26,43,.08);
  }
  .wordmark{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-bottom:28px;}
  .wordmark span{color:#6B7891;}
  .ring{
    width:54px;height:54px;margin:0 auto 22px;border-radius:50%;
    border:4px solid #E7EBF2;border-top-color:#2A7F9E;animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px;}
  p{font-size:15px;line-height:1.55;color:#324159;margin-bottom:6px;}
  .muted{color:#6B7891;font-size:13.5px;margin-top:4px;}
  .actions{margin-top:28px;display:flex;flex-direction:column;gap:12px;}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-family:inherit;font-weight:700;font-size:15px;border-radius:13px;
    padding:14px 20px;cursor:pointer;border:none;text-decoration:none;
  }
  .btn-primary{background:#0D1A2B;color:#fff;}
  .btn-primary:hover{background:#16273c;}
  .btn-play{background:#fff;color:#0D1A2B;border:1.5px solid #E7EBF2;}
  .btn-play:hover{border-color:#324159;}
  .btn-play small{display:block;font-size:10px;font-weight:500;opacity:.7;line-height:1.1;text-align:left;}
  .btn-play b{display:block;font-size:15px;font-weight:700;line-height:1.15;text-align:left;}
  .foot{margin-top:24px;font-size:12.5px;color:#6B7891;}
  .foot a{color:#2A7F9E;text-decoration:none;}
</style>
</head>
<body>
  <div class="card">
    <div class="wordmark">Docs<span>Buddy</span></div>
    <div class="ring" id="ring"></div>
    <h1>Opening DocsBuddy…</h1>
    <p>We're handing you back to the app to finish signing in.</p>
    <p class="muted">If nothing happens in a few seconds, tap “Open the app” below.</p>

    <div class="actions">
      <a class="btn btn-primary" id="openApp" href="#">Open the app</a>
      <a class="btn btn-play" id="playBtn" href="#" aria-label="Get it on Google Play">
        <svg width="20" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 2.3C3.3 2.6 3.1 3 3.1 3.6v16.8c0 .6.2 1 .5 1.3l.1.1L13 12.6v-.2L3.7 2.2l-.1.1z" fill="#00C3FF"/><path d="M16.1 15.7l-3.1-3.1v-.2l3.1-3.1.1.1 3.7 2.1c1 .6 1 1.6 0 2.2l-3.8 2-.1-.1z" fill="#FFC107"/><path d="M16.2 15.6L13 12.5 3.6 21.8c.4.4 1 .4 1.6.1l11-6.3z" fill="#F44336"/><path d="M16.2 9.4L5.2 3.1c-.6-.3-1.2-.3-1.6.1L13 12.5l3.2-3.1z" fill="#4CAF50"/></svg>
        <span><small>GET IT ON</small><b>Google Play</b></span>
      </a>
    </div>

    <div class="foot">Trouble signing in? <a href="mailto:support@docsbuddy.mytechbytes.in">Contact support</a></div>
  </div>

<script>
  (function () {
    // Custom scheme handoff. Preserve BOTH the query string and the hash fragment,
    // since Supabase magic-link / OAuth tokens may arrive in either.
    var APP_SCHEME = "in.mytechbytes.docsbuddy://login-callback";
    // Placeholder — replace with your live Play Store listing URL once published.
    var PLAY_URL = "https://play.google.com/store/apps/details?id=in.mytechbytes.docsbuddy";

    var deepLink = APP_SCHEME + (window.location.search || "") + (window.location.hash || "");

    function openApp() {
      // Assigning location triggers the OS to route to the installed app.
      window.location.href = deepLink;
    }

    // Wire fallback buttons.
    document.getElementById("openApp").setAttribute("href", deepLink);
    document.getElementById("openApp").addEventListener("click", function (e) {
      e.preventDefault();
      openApp();
    });
    document.getElementById("playBtn").setAttribute("href", PLAY_URL);

    // Attempt the handoff automatically on load.
    // A tiny delay lets the page paint the "Opening…" state first.
    setTimeout(openApp, 250);
  })();
</script>
</body>
</html>
